name: Inspect AI quiz status
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
    steps:
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check secret names without revealing values
        run: |
          project_ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https://([^.]+)\.supabase\.co/?$#\1#')
          if supabase secrets list --project-ref "$project_ref" --output json > "$RUNNER_TEMP/ai-secret-names.json" 2>/dev/null; then
            if grep -q '"GEMINI_API_KEY"' "$RUNNER_TEMP/ai-secret-names.json"; then echo 'Gemini API key: registered'; else echo 'Gemini API key: not found'; fi
            if grep -q '"GEMINI_FREE_TIER_CONFIRMED"' "$RUNNER_TEMP/ai-secret-names.json"; then echo 'Free-tier switch: registered'; else echo 'Free-tier switch: not found'; fi
          else
            echo 'Secret-name access unavailable'
          fi
      - name: Read sanitized AI generation events
        run: |
          node --input-type=module <<'NODE'
          const ref = new URL(process.env.SUPABASE_URL).hostname.split('.')[0];
          const end = new Date();
          const start = new Date(end.getTime() - 3600000);
          const params = new URLSearchParams({
            sql: "select timestamp, event_message from logs where source = 'function_logs' and event_message like '%gemini_quiz_%' order by timestamp desc limit 20",
            iso_timestamp_start: start.toISOString(), iso_timestamp_end: end.toISOString(),
          });
          const response = await fetch(`https://api.supabase.com/v1/projects/${ref}/analytics/endpoints/logs?${params}`, { headers: { authorization: `Bearer ${process.env.SUPABASE_ACCESS_TOKEN}` } });
          if (!response.ok) { console.log(`Log query unavailable: HTTP ${response.status}`); process.exit(1); }
          const data = await response.json();
          for (const row of data.result || []) {
            const message = String(row.event_message || '');
            const startAt = message.indexOf('{');
            try {
              const parsed = JSON.parse(message.slice(startAt));
              if (!['gemini_quiz_generation', 'gemini_quiz_api_error'].includes(parsed.event)) continue;
              const { event, outcome, http_status, status, scope, retry_after_seconds, input_tokens, output_tokens, thinking_tokens } = parsed;
              console.log(JSON.stringify({ event, outcome, http_status, status, scope, retry_after_seconds, input_tokens, output_tokens, thinking_tokens }));
            } catch { /* 원문 로그는 출력하지 않습니다. */ }
          }
          NODE
