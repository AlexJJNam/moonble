name: Deploy AI quiz generation

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/generate-quiz/**'
      - '.github/workflows/deploy-ai-quiz.yml'
  workflow_dispatch:
    inputs:
      confirm_free_tier:
        description: 'Gemini 프로젝트가 무료 요금제임을 확인하고 내부 생성을 활성화'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: moonble-ai-quiz
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      CONFIRM_FREE_TIER: ${{ github.event.inputs.confirm_free_tier || 'false' }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Deploy the authenticated function
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::SUPABASE_ACCESS_TOKEN is required."; exit 1; }
          project_ref=$(printf '%s' "$SUPABASE_URL" | sed -E 's#^https://([^.]+)\.supabase\.co/?$#\1#')
          test -n "$project_ref" && test "$project_ref" != "$SUPABASE_URL" || { echo "::error::VITE_SUPABASE_URL is invalid."; exit 1; }
          if [ "$CONFIRM_FREE_TIER" = "true" ]; then
            node --input-type=module <<'NODE'
          const base = process.env.SUPABASE_URL.replace(/\/$/, '');
          const key = process.env.SUPABASE_PUBLISHABLE_KEY;
          if (!key) throw new Error('VITE_SUPABASE_PUBLISHABLE_KEY is required');
          const user = '00000000-0000-4000-8000-000000000000';
          const request = '00000000-0000-4000-8000-000000000001';
          const checks = [
            ['rpc/moonble_ai_quiz_remaining', {}],
            ['rpc/moonble_reserve_ai_quiz_generation', { p_user_id: user, p_request_id: request, p_global_limit: null }],
            ['rpc/moonble_finish_ai_quiz_generation', { p_user_id: user, p_request_id: request, p_success: false }],
            ['ai_quiz_generation_requests?select=user_id&limit=1', null],
          ];
          for (const [path, body] of checks) {
            const result = await fetch(`${base}/rest/v1/${path}`, {
              method: body === null ? 'GET' : 'POST', headers: { apikey: key, 'content-type': 'application/json' }, ...(body === null ? {} : { body: JSON.stringify(body) }),
            });
            const data = await result.json();
            if (![401, 403].includes(result.status) || data?.code !== '42501') throw new Error(`035 migration or anonymous access restriction check failed: ${path}`);
          }
          console.log('AI quota endpoints are present and anonymous access is denied.');
          NODE
            supabase secrets set --project-ref "$project_ref" GEMINI_FREE_TIER_CONFIRMED=true
          fi
          supabase functions deploy generate-quiz --project-ref "$project_ref" --no-verify-jwt
