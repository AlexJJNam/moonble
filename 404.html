<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>페이지를 찾을 수 없습니다 · Moonble</title>
    <style>
      @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard-dynamic-subset.min.css');
      :root { color-scheme: light; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; color: #191f28; background: #fff; }
      * { box-sizing: border-box; }
      body { min-width: 320px; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; margin: 0; padding: 24px; }
      main { width: min(100%, 480px); display: grid; justify-items: center; text-align: center; }
      h1 { margin: 0; color: #1b64da; font-size: clamp(96px, 24vw, 144px); line-height: .95; letter-spacing: -.075em; font-weight: 800; font-variant-numeric: tabular-nums; }
      p { margin: 12px 0 0; color: #6b7684; font-size: 16px; line-height: 24px; }
      .action-area { width: 100%; margin-top: 28px; padding: 14px; border-radius: 18px; background: #e8f3ff; }
      a { min-height: 48px; display: flex; align-items: center; justify-content: center; padding: 12px 18px; border: 1px solid #c6e0ff; border-radius: 12px; color: #1b64da; background: #f5faff; font-size: 16px; line-height: 24px; font-weight: 650; text-decoration: none; transition: background-color 160ms ease, border-color 160ms ease; }
      a:hover { border-color: #9cc8fb; background: #fff; }
      a:focus-visible { outline: 3px solid rgb(49 130 246 / 28%); outline-offset: 3px; }
      @media (prefers-reduced-motion: reduce) { a { transition: none; } }
    </style>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>페이지를 찾을 수 없어요.</p>
      <div class="action-area"><a href="/">홈으로 돌아가기</a></div>
    </main>
  </body>
</html>
