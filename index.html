      (() => {
        const splash = document.getElementById('moonble-startup-splash');
        if (!splash) return;
        requestAnimationFrame(() => splash.classList.add('is-writing'));
        const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.setTimeout(() => {
          splash.classList.remove('is-writing');
