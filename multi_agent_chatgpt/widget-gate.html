<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>에이전트 선택</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; background: transparent; overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── Shimmer ────────────────────────────── */
    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .sh {
      background: linear-gradient(90deg, #f0f0f0 25%, #e4e4e4 50%, #f0f0f0 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s linear infinite;
    }

    /* ── 카드 헤더 ──────────────────────────── */
    .card-header {
      display: flex; align-items: center;
      height: 55px; padding: 0 8px 0 16px;
    }
    .card-title {
      font-size: 17px; font-weight: 510;
      letter-spacing: -0.43px; color: #000; white-space: nowrap;
    }

    /* ── 카드 본문 ──────────────────────────── */
    .card-body { display: flex; flex-direction: column; gap: 10px; }

    /* ── 질의 칩 ────────────────────────────── */
    .query-wrap { padding: 0 16px; }
    .query-chip {
      background: #f8f8f8; border-radius: 16px;
      height: 61px; padding: 20px;
      display: flex; align-items: flex-start; gap: 4px; overflow: hidden;
    }
    .q-tag { display: flex; align-items: center; gap: 3px; flex-shrink: 0; line-height: 18px; }
    .q-label  { color: #0263e8; font-size: 14px; white-space: nowrap; }
    .q-ticker { color: #5e6367; font-size: 14px; white-space: nowrap; }
    .q-text {
      flex: 1; min-width: 0; height: 20px; line-height: 20px;
      color: #5d5d5d; font-size: 14px; letter-spacing: -0.3px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
      display: flex; align-items: center;
    }

    /* ── 캐러셀 ─────────────────────────────── */
    .carousel-wrap {
      padding: 12px 16px 16px;
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .carousel-wrap::-webkit-scrollbar { display: none; }
    .carousel {
      display: flex; align-items: flex-start;
      gap: 0; flex-wrap: nowrap; justify-content: space-evenly;
    }

    /* ── 에이전트 아이템 ─────────────────────── */
    .agent-item {
      display: flex; flex-direction: column; align-items: center; gap: 10px;
      width: 110px; flex-shrink: 0;
    }
    .agent-circle {
      width: 80px; height: 80px; border-radius: 500px;
      display: flex; align-items: center; justify-content: center;
      padding: 8px; box-shadow: 4px 4px 16px rgba(0,0,0,0.06); flex-shrink: 0;
    }
    .agent-circle img { width: 58px; height: 58px; display: block; object-fit: contain; }
    .agent-content { display: flex; flex-direction: column; gap: 16px; width: 100%; }
    .agent-info    { display: flex; flex-direction: column; gap: 8px; align-items: center; }
    .agent-name {
      font-size: 17px; font-weight: 510; letter-spacing: -0.43px;
      color: #0d0d0d; text-align: center; width: 100%;
    }
    .agent-desc {
      font-size: 14px; color: #5d5d5d; text-align: center;
      line-height: 20px; letter-spacing: -0.3px;
      height: 40px; overflow: hidden;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
    }
    .agent-btn {
      background: #0d0d0d; color: #fff;
      border: none; border-radius: 999px;
      height: 36px; width: 110px; font-family: inherit;
      font-size: 13px; font-weight: 590; letter-spacing: -0.2px;
      cursor: pointer; transition: opacity 0.12s;
    }
    .agent-btn:hover  { opacity: 0.82; }
    .agent-btn:active { opacity: 0.65; }

    /* ── 스켈레톤 전용 ──────────────────────── */
    .sk-title { height: 13px; width: 160px; border-radius: 8px; }
    .sk-chip  { height: 44px; border-radius: 12px; }
    .sk-circle-ph { width: 80px; height: 80px; border-radius: 500px; }
    .sk-bar { height: 8px; border-radius: 8px; }
    .sk-btn { height: 36px; width: 88px; border-radius: 999px; }
    .sk-info { display: flex; flex-direction: column; gap: 6px; align-items: center; }

    /* 실제 콘텐츠 fade-in */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    .fade-in { animation: fadeIn 0.25s ease forwards; }
  </style>
</head>
<body>

<div id="card">
  <!-- 헤더 -->
  <div class="card-header" id="cardHeader">
    <div class="sk-title sh"></div>
  </div>

  <div class="card-body">
    <!-- 질의 칩 -->
    <div class="query-wrap" id="queryWrap">
      <div class="sk-chip sh"></div>
    </div>

    <!-- 캐러셀 -->
    <div class="carousel-wrap">
      <div class="carousel" id="carousel">
        <!-- 스켈레톤 아이템 5개 -->
        <div class="agent-item">
          <div class="sk-circle-ph sh"></div>
          <div class="agent-content">
            <div class="sk-info">
              <div class="sk-bar sh" style="width:52px"></div>
              <div class="sk-bar sh" style="width:76px"></div>
              <div class="sk-bar sh" style="width:60px"></div>
            </div>
            <div class="sk-btn sh"></div>
          </div>
        </div>
        <div class="agent-item">
          <div class="sk-circle-ph sh"></div>
          <div class="agent-content">
            <div class="sk-info">
              <div class="sk-bar sh" style="width:50px"></div>
              <div class="sk-bar sh" style="width:76px"></div>
              <div class="sk-bar sh" style="width:60px"></div>
            </div>
            <div class="sk-btn sh"></div>
          </div>
        </div>
        <div class="agent-item">
          <div class="sk-circle-ph sh"></div>
          <div class="agent-content">
            <div class="sk-info">
              <div class="sk-bar sh" style="width:55px"></div>
              <div class="sk-bar sh" style="width:76px"></div>
              <div class="sk-bar sh" style="width:60px"></div>
            </div>
            <div class="sk-btn sh"></div>
          </div>
        </div>
        <div class="agent-item">
          <div class="sk-circle-ph sh"></div>
          <div class="agent-content">
            <div class="sk-info">
              <div class="sk-bar sh" style="width:65px"></div>
              <div class="sk-bar sh" style="width:76px"></div>
              <div class="sk-bar sh" style="width:60px"></div>
            </div>
            <div class="sk-btn sh"></div>
          </div>
        </div>
        <div class="agent-item">
          <div class="sk-circle-ph sh"></div>
          <div class="agent-content">
            <div class="sk-info">
              <div class="sk-bar sh" style="width:60px"></div>
              <div class="sk-bar sh" style="width:76px"></div>
              <div class="sk-bar sh" style="width:60px"></div>
            </div>
            <div class="sk-btn sh"></div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  var AGENTS = [
    { id: 'valuation',   name: '밸류에이션', desc: '밸류 관점에서 위 주제에 답변합니다.',      color: '#ffcaca', icon: 'assets/widget-gate/gate-icon-agent-valuation.svg' },
    { id: 'news',        name: '뉴스',       desc: '뉴스 관점에서 위 주제에 답변합니다.',       color: '#dbffd2', icon: 'assets/widget-gate/gate-icon-agent-news.svg'      },
    { id: 'factor',      name: '팩터',       desc: '팩터 관점에서 위 주제에 답변합니다.',      color: '#c7eeff', icon: 'assets/widget-gate/gate-icon-agent-factor.svg'    },
    { id: 'report',      name: '리포트',     desc: '리포트 관점에서 위 주제에 답변합니다.',    color: '#c0c6ff', icon: 'assets/widget-gate/gate-icon-agent-report.svg'    },
    { id: 'fundamental', name: '펀더멘탈',   desc: '펀더멘탈 관점에서 위 주제에 답변합니다.', color: '#f3f3f3', icon: 'assets/widget-gate/gate-icon-fundamental.svg'     },
  ];

  var params = new URLSearchParams(location.search);
  var ticker = params.get('ticker') || '';
  var query  = params.get('q')      || '';

  /* ── 이미지 프리로드 후 콘텐츠 교체 ────────── */
  var loaded = 0;
  var startTime = Date.now();
  var MIN_DELAY = 700;

  function onAllLoaded() {
    var wait = Math.max(0, MIN_DELAY - (Date.now() - startTime));
    setTimeout(revealContent, wait);
  }

  function onLoad() {
    if (++loaded >= AGENTS.length) onAllLoaded();
  }

  AGENTS.forEach(function(a) {
    var img = new Image();
    img.onload = img.onerror = onLoad;
    img.src = a.icon;
  });

  /* ── 실제 콘텐츠로 DOM 교체 ─────────────────── */
  function revealContent() {
    // 1. 헤더 타이틀 교체
    var header = document.getElementById('cardHeader');
    header.innerHTML = '<span class="card-title fade-in">주제에 맞는 에이전트 선택하기</span>';

    // 2. 질의 칩 교체
    var qWrap = document.getElementById('queryWrap');
    var tickerHtml = ticker
      ? '<span class="q-ticker">(' + ticker + ')</span>'
      : '';
    qWrap.innerHTML =
      '<div class="query-chip fade-in">' +
        '<div class="q-tag">' +
          '<span class="q-label">질의</span>' +
          tickerHtml +
        '</div>' +
        '<span class="q-text">' + query + '</span>' +
      '</div>';

    // 3. 캐러셀 아이템 교체
    var carousel = document.getElementById('carousel');
    carousel.innerHTML = '';
    AGENTS.forEach(function(a) {
      var item = document.createElement('div');
      item.className = 'agent-item fade-in';
      item.innerHTML =
        '<div class="agent-circle" style="background:' + a.color + '">' +
          '<img src="' + a.icon + '" alt="' + a.name + '">' +
        '</div>' +
        '<div class="agent-content">' +
          '<div class="agent-info">' +
            '<div class="agent-name">' + a.name + '</div>' +
            '<div class="agent-desc">' + a.desc + '</div>' +
          '</div>' +
          '<button class="agent-btn" data-agent="' + a.id + '">선택하기</button>' +
        '</div>';
      carousel.appendChild(item);
    });

    reportHeight();

    // 4. 선택 이벤트
    carousel.addEventListener('click', function(e) {
      var btn = e.target.closest('.agent-btn');
      if (!btn) return;
      window.parent.postMessage({ type: 'gate-select', agent: btn.dataset.agent }, '*');
    });
  }

  /* ── 높이 보고 ──────────────────────────────── */
  function reportHeight() {
    var h = document.getElementById('card').offsetHeight;
    window.parent.postMessage({ type: 'resize', height: h }, '*');
  }

  window.addEventListener('load', function() {
    reportHeight();
    if (window.ResizeObserver) {
      new ResizeObserver(reportHeight).observe(document.getElementById('card'));
    }
  });
</script>

</body>
</html>
